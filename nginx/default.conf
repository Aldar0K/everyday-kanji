# Обратный прокси — единственная точка входа в приложение.
#
# Работает за SSL, который терминируется на хосте. Внутри сети Docker слушает
# обычный HTTP и раскладывает запросы по сервисам.
#
# Почему фронтенд и API живут на одном домене: идентификация пользователя
# держится на куке device_id. Раздай мы статику с другого источника, кука
# перестала бы ходить, и сервер заводил бы новое устройство на каждый запрос.
#
# Важно про 502 после пересборки: при `docker compose up -d --build` контейнеры
# получают НОВЫЕ внутренние IP. Если указать имя сервиса прямо в proxy_pass,
# nginx резолвит его один раз при старте и кэширует адрес — после пересоздания
# контейнеров он стучится по устаревшему IP и отдаёт 502 до ручного рестарта.
#
# Решение: встроенный DNS Docker плюс адрес через ПЕРЕМЕННУЮ. proxy_pass с
# переменной заставляет перерезолвивать имя на каждый запрос.

server {
    listen 80;
    server_name _;

    # Кандзи и описания — данные небольшие, но текстовые: сжатие заметно
    # экономит трафик на мобильном.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Встроенный DNS Docker. valid=10s — как часто перечитывать запись.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        # X-Real-IP именно перезаписывается, а не дописывается: на нём держится
        # лимитер, а X-Forwarded-For в левой части контролируется клиентом.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
