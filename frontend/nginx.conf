# Раздача собранной статики фронтенда внутри контейнера.
# Внешний прокси (сервис nginx) направляет сюда всё, что не /api/.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хэшированные ассеты можно кэшировать надолго: при изменении содержимого
    # меняется имя файла.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Приложение одностраничное: любой неизвестный путь отдаёт index.html,
    # иначе прямой заход на /day/12/strokes вернул бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
