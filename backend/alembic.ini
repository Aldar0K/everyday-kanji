[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url здесь намеренно не задан: URL берётся из переменной окружения
# в alembic/env.py. В ini-файле символ % трактуется как подстановка и ломал бы
# конфиг на паролях, где он встречается.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
