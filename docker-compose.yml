# Имя проекта задано явно: на сервере рядом живёт другой проект, и без этого
# Compose взял бы имя каталога, что рискует пересечением сетей и контейнеров.
name: everyday-kanji

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Секции ports нет намеренно: база доступна только внутри сети Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Персистентности нет: тут только кэш и счётчики лимитера, терять не жалко.
    # Отсюда же отсутствие volume — чтобы не плодить лишние бэкапы.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # Секции ports нет намеренно.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Хосты внутри сети Compose, а не localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Наружу не публикуется: доступ только через nginx.
    expose:
      - "8000"
    # --proxy-headers и --forwarded-allow-ips нужны, чтобы за двумя прокси
    # (nginx на хосте → nginx в Compose → контейнер) в request.client.host
    # попадал реальный IP клиента, а не адрес прокси. Иначе лимитер посчитает
    # всех одним клиентом.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips="*"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Единственный сервис с публикацией порта, и строго на 127.0.0.1: без
    # явного адреса Docker пишет правила прямо в iptables в обход ufw, и порт
    # оказывается открыт всему интернету.
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    name: everyday_kanji_pgdata
