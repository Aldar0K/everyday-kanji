# Автоматический деплой на VPS при пуше в main.
#
# Секреты задаются в настройках репозитория (Settings → Secrets and variables →
# Actions):
#   VPS_HOST     — адрес сервера
#   VPS_USER     — пользователь SSH
#   VPS_SSH_KEY  — приватный ключ целиком, вместе со строками BEGIN/END
#
# На сервере должен лежать файл .env: он в .gitignore, поэтому git pull его не
# принесёт, а без него docker compose не поднимется.

name: Деплой на VPS

on:
  push:
    branches: [main]
  # Ручной запуск из вкладки Actions — чтобы перевыкатить без пустого коммита.
  workflow_dispatch:

# Два пуша подряд иначе дадут два параллельных SSH-сеанса, которые одновременно
# делают git pull и docker build в одном каталоге. Ждём предыдущий деплой, а не
# отменяем его: прерванный на середине деплой хуже задержки.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкатить на сервер
    runs-on: ubuntu-latest

    steps:
      - name: Подключиться по SSH и выкатить
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Без этого команды выполняются до конца даже после ошибки, и
          # упавшая миграция дала бы зелёную галочку при сломанном проде.
          script_stop: true
          script: |
            set -e
            cd /root/everyday-kanji

            # --ff-only: если на сервере что-то коммитили руками, pull упадёт
            # явно, вместо того чтобы оставить репозиторий в состоянии
            # незавершённого слияния.
            git pull --ff-only origin main

            # Порядок шагов важен. Миграции лежат ВНУТРИ образа (в проде
            # монтируется только backend/data), поэтому образ нужно собрать
            # раньше, чем накатывать схему, — иначе alembic отработает по
            # старому коду и не увидит новых ревизий.
            docker compose build

            # Схема накатывается до старта нового кода: приложение намеренно не
            # запускает миграции само (при нескольких воркерах это гонка), и
            # запущенное против старой схемы оно отвечало бы ошибками.
            # Команда сама поднимет db и redis и дождётся их готовности.
            docker compose run --rm backend alembic upgrade head

            docker compose up -d

            # Освобождаем место от образов, вытесненных пересборкой.
            docker image prune -f
